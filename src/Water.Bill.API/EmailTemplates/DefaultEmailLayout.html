<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{EmailTitle}}</title>
</head>
<body style="margin:0;background:#f3f7fb;font-family:Arial,Helvetica,sans-serif;color:#102033;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f7fb;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #d9e5ef;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#0c4a6e;color:#ffffff;padding:18px 24px;">
              <strong style="font-size:18px;">Noida Water Billing System</strong>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;font-size:14px;line-height:1.65;">
              <h1 style="font-size:20px;margin:0 0 14px;color:#102033;">{{EmailTitle}}</h1>
              {{EmailBody}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background:#eef6fb;color:#587086;font-size:12px;">
              {{FooterText}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
